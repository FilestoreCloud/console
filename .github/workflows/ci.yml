name: Console CI Quality Gate

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: console-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-console:
    name: Console Checks (TypeScript, Vitest, Bundle Size)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Verification
        run: npx tsc --noEmit

      - name: Run Unit Tests with Coverage Gate (> 85%)
        run: npm run test:coverage

      - name: Build Bundle & Verify Budget (< 500 KB per chunk)
        run: npm run build
