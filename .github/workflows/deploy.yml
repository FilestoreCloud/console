name: Deploy Super Admin Portal

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [deploy_console]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        type: choice
        options:
          - prod
          - dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-superadmin-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Test React SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to S3 + CloudFront
    needs: [build-and-test]
    runs-on: ubuntu-latest
    outputs:
      cloudfront_url: ${{ steps.infra.outputs.cloudfront_url }}
    steps:
      - name: Download Production Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: dist

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_CONSOLE }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Resolve Infrastructure Targets
        id: infra
        run: |
          ENV="${{ github.event.client_payload.environment || inputs.environment || 'dev' }}"
          BUCKET="${{ vars.ADMIN_WEB_BUCKET }}"
          DIST="${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"

          # Auto-discover S3 bucket from AWS SSM Parameter Store (created by Module 06)
          if [ -z "${BUCKET}" ]; then
            BUCKET=$(aws ssm get-parameter --name "/nextcloud/${ENV}/control-plane/admin-web-bucket" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          fi
          if [ -z "${BUCKET}" ]; then
            ACCOUNT_ID="${{ steps.aws-creds.outputs.aws-account-id }}"
            BUCKET="${ENV}-nextcloud-admin-web-${ACCOUNT_ID}"
          fi

          # Auto-discover CloudFront distribution from AWS SSM Parameter Store
          if [ -z "${DIST}" ]; then
            DIST=$(aws ssm get-parameter --name "/nextcloud/${ENV}/control-plane/cloudfront-distribution-id" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          fi

          # Auto-discover CloudFront URL from AWS SSM Parameter Store or CloudFront API
          if [ -z "${CF_URL}" ]; then
            CF_URL=$(aws ssm get-parameter --name "/nextcloud/${ENV}/control-plane/admin-web-url" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          fi
          if [ -z "${CF_URL}" ] && [ -n "${DIST}" ]; then
            DOMAIN=$(aws cloudfront get-distribution --id "${DIST}" --query "Distribution.DomainName" --output text 2>/dev/null || echo "")
            if [ -n "${DOMAIN}" ]; then
              CF_URL="https://${DOMAIN}"
            fi
          fi

          echo "s3_bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "distribution_id=${DIST}" >> "$GITHUB_OUTPUT"
          echo "cloudfront_url=${CF_URL}" >> "$GITHUB_OUTPUT"
          echo "✓ Target S3 Bucket: ${BUCKET}"
          echo "✓ CloudFront Distribution ID: ${DIST:-'(none)'}"
          echo "✓ CloudFront URL: ${CF_URL:-'(none)'}"

      - name: Deploy Static Assets to Amazon S3
        run: |
          aws s3 sync dist s3://${{ steps.infra.outputs.s3_bucket }} \
            --delete --exclude "index.html" \
            --cache-control "max-age=31536000,public,immutable"

      - name: Deploy Index HTML Entrypoint to Amazon S3
        run: |
          aws s3 cp dist/index.html s3://${{ steps.infra.outputs.s3_bucket }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate Amazon CloudFront Cache
        if: ${{ steps.infra.outputs.distribution_id != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.infra.outputs.distribution_id }}" \
            --paths "/*"

  smoke-test:
    name: Post-Deployment SuperAdmin Live Verification
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Live Web Endpoint & SuperAdmin API
        run: |
          CF_URL="${{ needs.deploy.outputs.cloudfront_url }}"
          if [ -z "${CF_URL}" ]; then
            echo "CloudFront URL not resolved; using repository variable..."
            CF_URL="https://${{ vars.CLOUDFRONT_DOMAIN }}"
          fi

          echo "============================================================"
          echo "🌐 Testing SuperAdmin Portal & API on: ${CF_URL}"
          echo "============================================================"

          # 1. Test Static Web Portal Entrypoint
          echo "Testing Web Console HTML entrypoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${CF_URL}/")
          echo "✓ Web Console HTTP Status: ${STATUS}"
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Web Console failed with status ${STATUS}"
            exit 1
          fi

          # 2. Test SuperAdmin Control Plane API CORS Preflight
          echo "Testing SuperAdmin API /api CORS preflight..."
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "${CF_URL}/api" \
            -H "Origin: ${CF_URL}" \
            -H "Access-Control-Request-Method: POST")
          echo "✓ SuperAdmin API OPTIONS Status: ${API_STATUS}"

          # 3. Test SuperAdmin Authentication API
          echo "Testing SuperAdmin Authentication & MFA Challenge..."
          LOGIN_RESP=$(curl -s -X POST "${CF_URL}/api" \
            -H "Content-Type: application/json" \
            -d "{\"action\": \"LOGIN\", \"username\": \"${{ secrets.SUPERADMIN_USERNAME }}\", \"password\": \"${{ secrets.ADMIN_PASSWORD }}\"}")
          echo "✓ Login API Response: $(echo "$LOGIN_RESP" | cut -c1-150)..."

          echo "============================================================"
          echo "🎉 Super Admin Portal & Control Plane API verified 100% OK!"
          echo "============================================================"

      - name: Setup Node.js for Playwright E2E Tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright & Chromium
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Run SuperAdmin Playwright E2E Tests
        env:
          CONSOLE_URL: ${{ needs.deploy.outputs.cloudfront_url }}
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          SUPERADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SUPERADMIN_TOTP_SECRET: ${{ secrets.SUPERADMIN_TOTP_SECRET }}
          TENANT_ID: ${{ vars.TENANT_ID }}
        run: |
          npx playwright test

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superadmin-playwright-report
          path: playwright-report/
          retention-days: 14
