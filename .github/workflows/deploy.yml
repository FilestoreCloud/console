name: Deploy

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [deploy_console]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        type: choice
        options:
          - prod
          - dev
  workflow_call:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        type: string
        default: "dev"
      admin_web_bucket:
        description: "Target S3 Bucket Name for Web SPA"
        required: false
        type: string
        default: ""
      cloudfront_distribution_id:
        description: "Target CloudFront Distribution ID"
        required: false
        type: string
        default: ""
      ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
      run_smoke_test:
        description: "Run Playwright and Smoke tests after deploy"
        required: false
        type: boolean
        default: false
    outputs:
      cloudfront_url:
        description: "Resolved CloudFront URL"
        value: ${{ jobs.deploy.outputs.cloudfront_url }}
      s3_bucket:
        description: "Target S3 Bucket"
        value: ${{ jobs.deploy.outputs.s3_bucket }}
      distribution_id:
        description: "Target CloudFront Distribution ID"
        value: ${{ jobs.deploy.outputs.distribution_id }}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-superadmin-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Test React SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Upload Production Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: console-dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to S3 + CloudFront
    needs: [build-and-test]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
      url: ${{ steps.deploy-spa.outputs.cloudfront_url }}
    outputs:
      cloudfront_url: ${{ steps.deploy-spa.outputs.cloudfront_url }}
      s3_bucket: ${{ steps.deploy-spa.outputs.s3_bucket }}
      distribution_id: ${{ steps.deploy-spa.outputs.distribution_id }}
    steps:
      - name: Download Production Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: dist

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_CONSOLE || secrets.AWS_ROLE_INFRA }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy Static Assets & Invalidate Cache (AWS Python SDK)
        id: deploy-spa
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DEPLOY_ENV: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
          ADMIN_WEB_BUCKET: ${{ inputs.admin_web_bucket || vars.ADMIN_WEB_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ inputs.cloudfront_distribution_id || vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          pip install boto3
          python3 -c "
          import os, sys, boto3, mimetypes, time
          from botocore.exceptions import ClientError

          region = os.environ['AWS_REGION']
          env_name = os.environ['DEPLOY_ENV']
          ssm = boto3.client('ssm', region_name=region)
          s3 = boto3.client('s3', region_name=region)
          cf = boto3.client('cloudfront', region_name=region)

          bucket = os.environ.get('ADMIN_WEB_BUCKET', '').strip()
          if not bucket:
              try:
                  bucket = ssm.get_parameter(Name=f'/nextcloud/{env_name}/control-plane/admin-web-bucket')['Parameter']['Value']
              except Exception:
                  sts = boto3.client('sts', region_name=region)
                  acc_id = sts.get_caller_identity()['Account']
                  bucket = f'{env_name}-nextcloud-admin-web-{acc_id}'

          dist_id = os.environ.get('CLOUDFRONT_DISTRIBUTION_ID', '').strip()
          if not dist_id:
              try:
                  dist_id = ssm.get_parameter(Name=f'/nextcloud/{env_name}/control-plane/cloudfront-distribution-id')['Parameter']['Value']
              except Exception:
                  pass

          cf_url = ''
          try:
              cf_url = ssm.get_parameter(Name=f'/nextcloud/{env_name}/control-plane/admin-web-url')['Parameter']['Value']
          except Exception:
              if dist_id:
                  try:
                      domain = cf.get_distribution(Id=dist_id)['Distribution']['DomainName']
                      cf_url = f'https://{domain}'
                  except Exception:
                      pass

          print(f'Target S3 Bucket: {bucket}')
          print(f'Target CloudFront Distribution: {dist_id}')
          print(f'Resolved CloudFront URL: {cf_url}')

          dist_dir = 'dist'
          for root, _, files in os.walk(dist_dir):
              for filename in files:
                  local_path = os.path.join(root, filename)
                  rel_path = os.path.relpath(local_path, dist_dir).replace('\\\\', '/')
                  content_type, _ = mimetypes.guess_type(local_path)
                  if not content_type:
                      content_type = 'application/octet-stream'
                  cache_ctrl = 'no-cache, no-store, must-revalidate' if rel_path == 'index.html' else 'max-age=31536000,public,immutable'
                  with open(local_path, 'rb') as fp:
                      s3.put_object(
                          Bucket=bucket,
                          Key=rel_path,
                          Body=fp,
                          ContentType=content_type,
                          CacheControl=cache_ctrl
                      )
                  print(f'Uploaded: {rel_path} ({content_type})')

          if dist_id:
              cf.create_invalidation(
                  DistributionId=dist_id,
                  InvalidationBatch={
                      'Paths': {'Quantity': 1, 'Items': ['/*']},
                      'CallerReference': f'gha-{int(time.time())}'
                  }
              )
              print(f'CloudFront invalidation submitted for {dist_id}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'cloudfront_url={cf_url}\n')
              out.write(f's3_bucket={bucket}\n')
              out.write(f'distribution_id={dist_id}\n')
          "

  smoke-test:
    name: Post-Deployment SuperAdmin Live Verification
    needs: [deploy]
    if: ${{ github.event_name != 'workflow_call' || inputs.run_smoke_test }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: Verify Live Web Endpoint & SuperAdmin API
        run: |
          CF_URL="${{ needs.deploy.outputs.cloudfront_url }}"
          if [ -z "${CF_URL}" ]; then
            echo "CloudFront URL not resolved; using repository variable..."
            CF_URL="https://${{ vars.CLOUDFRONT_DOMAIN }}"
          fi

          echo "============================================================"
          echo "🌐 Testing SuperAdmin Portal & API on: ${CF_URL}"
          echo "============================================================"

          # 1. Test Static Web Portal Entrypoint
          echo "Testing Web Console HTML entrypoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${CF_URL}/")
          echo "✓ Web Console HTTP Status: ${STATUS}"
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Web Console failed with status ${STATUS}"
            exit 1
          fi

          # 2. Test SuperAdmin Control Plane API CORS Preflight
          echo "Testing SuperAdmin API /api CORS preflight..."
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "${CF_URL}/api" \
            -H "Origin: ${CF_URL}" \
            -H "Access-Control-Request-Method: POST")
          echo "✓ SuperAdmin API OPTIONS Status: ${API_STATUS}"

          # 3. Test SuperAdmin Authentication API
          echo "Testing SuperAdmin Authentication & MFA Challenge..."
          LOGIN_RESP=$(curl -s -X POST "${CF_URL}/api" \
            -H "Content-Type: application/json" \
            -d "{\"action\": \"LOGIN\", \"username\": \"${{ secrets.SUPERADMIN_USERNAME }}\", \"password\": \"${{ secrets.ADMIN_PASSWORD }}\"}")
          echo "✓ Login API Response: $(echo "$LOGIN_RESP" | cut -c1-150)..."

          echo "============================================================"
          echo "🎉 Super Admin Portal & Control Plane API verified 100% OK!"
          echo "============================================================"

      - name: Setup Node.js for Playwright E2E Tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright & Chromium
        run: |
          npm install -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Run SuperAdmin Playwright E2E Tests
        env:
          CONSOLE_URL: ${{ needs.deploy.outputs.cloudfront_url }}
          SUPERADMIN_USERNAME: ${{ secrets.SUPERADMIN_USERNAME }}
          SUPERADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SUPERADMIN_TOTP_SECRET: ${{ secrets.SUPERADMIN_TOTP_SECRET }}
          TENANT_ID: ${{ vars.TENANT_ID }}
        run: |
          if [ -z "$CONSOLE_URL" ]; then
            export CONSOLE_URL="https://${{ vars.CLOUDFRONT_DOMAIN }}"
          fi
          npx playwright test

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: superadmin-playwright-report
          path: playwright-report/
          retention-days: 14
