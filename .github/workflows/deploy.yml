name: Deploy Super Admin Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        type: choice
        options:
          - prod
          - dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-superadmin-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Test React SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Upload Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to S3 + CloudFront
    needs: [build-and-test]
    runs-on: ubuntu-latest
    outputs:
      cloudfront_url: ${{ steps.infra.outputs.cloudfront_url }}
    steps:
      - name: Download Production Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: dist

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_CONSOLE }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Resolve Infrastructure Targets
        id: infra
        run: |
          ENV="${{ inputs.environment }}"
          if [ -z "${ENV}" ]; then
            ENV="prod"
          fi
          BUCKET="${{ vars.ADMIN_WEB_BUCKET }}"
          DIST="${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"

          # Auto-discover S3 bucket from AWS SSM Parameter Store (created by Module 06)
          if [ -z "${BUCKET}" ]; then
            BUCKET=$(aws ssm get-parameter --name "/nextcloud/${ENV}/control-plane/admin-web-bucket" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          fi
          if [ -z "${BUCKET}" ]; then
            ACCOUNT_ID="${{ steps.aws-creds.outputs.aws-account-id }}"
            BUCKET="${ENV}-nextcloud-admin-web-${ACCOUNT_ID}"
          fi

          # Auto-discover CloudFront distribution from AWS SSM Parameter Store
          if [ -z "${DIST}" ]; then
            DIST=$(aws ssm get-parameter --name "/nextcloud/${ENV}/control-plane/cloudfront-distribution-id" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          fi

          # Auto-discover CloudFront URL from AWS SSM Parameter Store or CloudFront API
          if [ -z "${CF_URL}" ]; then
            CF_URL=$(aws ssm get-parameter --name "/nextcloud/${ENV}/control-plane/admin-web-url" --query "Parameter.Value" --output text 2>/dev/null || echo "")
          fi
          if [ -z "${CF_URL}" ] && [ -n "${DIST}" ]; then
            DOMAIN=$(aws cloudfront get-distribution --id "${DIST}" --query "Distribution.DomainName" --output text 2>/dev/null || echo "")
            if [ -n "${DOMAIN}" ]; then
              CF_URL="https://${DOMAIN}"
            fi
          fi

          echo "s3_bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "distribution_id=${DIST}" >> "$GITHUB_OUTPUT"
          echo "cloudfront_url=${CF_URL}" >> "$GITHUB_OUTPUT"
          echo "✓ Target S3 Bucket: ${BUCKET}"
          echo "✓ CloudFront Distribution ID: ${DIST:-'(none)'}"
          echo "✓ CloudFront URL: ${CF_URL:-'(none)'}"

      - name: Deploy Static Assets to Amazon S3
        run: |
          aws s3 sync dist s3://${{ steps.infra.outputs.s3_bucket }} \
            --delete --exclude "index.html" \
            --cache-control "max-age=31536000,public,immutable"

      - name: Deploy Index HTML Entrypoint to Amazon S3
        run: |
          aws s3 cp dist/index.html s3://${{ steps.infra.outputs.s3_bucket }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate Amazon CloudFront Cache
        if: ${{ steps.infra.outputs.distribution_id != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.infra.outputs.distribution_id }}" \
            --paths "/*"

  smoke-test:
    name: Post-Deployment Smoke Verification
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Live Web Endpoint
        run: |
          CF_URL="${{ needs.deploy.outputs.cloudfront_url }}"
          if [ -n "${CF_URL}" ]; then
            echo "Testing public web endpoint: ${CF_URL}..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${CF_URL}/")
            echo "Endpoint HTTP Status: ${STATUS}"
            if [ "$STATUS" -eq 200 ]; then
              echo "🎉 Super Admin Portal is live and healthy: HTTP 200 OK"
            else
              echo "⚠️ Endpoint returned HTTP status: ${STATUS}"
            fi
          else
            echo "CloudFront URL not resolved; skipping live smoke test."
          fi
