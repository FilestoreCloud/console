name: Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment to Undeploy"
        required: true
        type: choice
        default: dev
        options:
          - dev
          - staging
          - prod
      confirmation:
        description: "Safety Confirmation: Type DESTROY to proceed"
        required: true
        type: string

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

concurrency:
  group: destroy-superadmin-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  undeploy:
    name: Undeploy Web Console & Purge S3 Objects
    runs-on: ubuntu-latest
    steps:
      - name: Verify Safety Confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "❌ Undeploy aborted: You must type 'DESTROY' in the confirmation input to prevent accidental deletion."
            exit 1
          fi
          echo "⚠️ Confirmation verified. Undeploying Super Admin Portal from ${{ inputs.environment }}..."

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_CONSOLE }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Resolve Infrastructure Targets
        id: infra
        run: |
          ENV="${{ inputs.environment }}"
          ACCOUNT_ID="${{ steps.aws-creds.outputs.aws-account-id }}"
          BUCKET="${{ vars.ADMIN_WEB_BUCKET }}"
          if [ -z "${BUCKET}" ]; then
            BUCKET="${ENV}-nextcloud-admin-web-${ACCOUNT_ID}"
          fi
          DIST="${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "s3_bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "distribution_id=${DIST}" >> "$GITHUB_OUTPUT"
          echo "Target S3 Bucket to empty: ${BUCKET}"
          echo "Target CloudFront Distribution to invalidate: ${DIST:-'(none)'}"

      - name: Wipe S3 Bucket Objects (Including Versions & Delete Markers)
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          BUCKET="${{ steps.infra.outputs.s3_bucket }}"
          echo "Purging all objects and versions from s3://${BUCKET}..."
          python3 -c "
          import boto3, os
          bucket_name = '${BUCKET}'
          s3 = boto3.resource('s3', region_name=os.environ['AWS_REGION'])
          try:
              bucket = s3.Bucket(bucket_name)
              bucket.object_versions.delete()
              bucket.objects.all().delete()
              print(f'✓ Successfully wiped all versions and objects from {bucket_name}.')
          except Exception as e:
              print(f'Notice during bucket wipe: {e}')
          "
          echo "✅ S3 bucket s3://${BUCKET} wiped cleanly."

      - name: Invalidate Amazon CloudFront Cache
        if: ${{ steps.infra.outputs.distribution_id != '' }}
        continue-on-error: true
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          python3 -c "
          import boto3, os, time
          dist_id = '${{ steps.infra.outputs.distribution_id }}'
          if dist_id:
              cf = boto3.client('cloudfront', region_name=os.environ['AWS_REGION'])
              cf.create_invalidation(
                  DistributionId=dist_id,
                  InvalidationBatch={
                      'Paths': {'Quantity': 1, 'Items': ['/*']},
                      'CallerReference': f'destroy-{int(time.time())}'
                  }
              )
              print(f'CloudFront invalidation created for {dist_id}')
          "

      - name: Summary Report
        run: |
          echo "============================================================"
          echo "🎉 Super Admin Portal undeployed and S3 bucket wiped cleanly!"
          echo "Environment : ${{ inputs.environment }}"
          echo "S3 Bucket   : ${{ steps.infra.outputs.s3_bucket }}"
          echo "CloudFront  : ${{ steps.infra.outputs.distribution_id }}"
          echo "============================================================"
