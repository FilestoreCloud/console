name: Destroy / Undeploy Super Admin Portal

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment to Undeploy"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev
      confirmation:
        description: "Safety Confirmation: Type DESTROY to proceed"
        required: true
        default: ""
        type: string

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

concurrency:
  group: destroy-superadmin-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  undeploy:
    name: Undeploy Web Console & Purge S3 Objects
    runs-on: ubuntu-latest
    steps:
      - name: Verify Safety Confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "❌ Undeploy aborted: You must type 'DESTROY' in the confirmation input to prevent accidental deletion."
            exit 1
          fi
          echo "⚠️ Confirmation verified. Undeploying Super Admin Portal from ${{ inputs.environment }}..."

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || 'arn:aws:iam::649519997247:role/coderpush-github-actions-role' }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          audience: sts.amazonaws.com

      - name: Resolve Infrastructure Targets
        id: infra
        run: |
          ENV="${{ inputs.environment || 'prod' }}"
          ACCOUNT_ID="${{ steps.aws-creds.outputs.aws-account-id }}"
          BUCKET="${{ vars.ADMIN_WEB_BUCKET }}"
          if [ -z "${BUCKET}" ]; then
            BUCKET="${ENV}-nextcloud-admin-web-${ACCOUNT_ID}"
          fi
          DIST="${{ vars.CLOUDFRONT_DISTRIBUTION_ID || secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "s3_bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "distribution_id=${DIST}" >> "$GITHUB_OUTPUT"
          echo "Target S3 Bucket to empty: ${BUCKET}"
          echo "Target CloudFront Distribution to invalidate: ${DIST:-'(none)'}"

      - name: Prepare Clean Empty Source Directory
        run: |
          mkdir -p /tmp/empty_payload

      - name: Wipe S3 Bucket Objects (Sync Empty Directory)
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete
        env:
          AWS_S3_BUCKET: ${{ steps.infra.outputs.s3_bucket }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          SOURCE_DIR: "/tmp/empty_payload"

      - name: Invalidate Amazon CloudFront Cache
        uses: chetan/invalidate-cloudfront-action@v2
        if: ${{ steps.infra.outputs.distribution_id != '' }}
        env:
          DISTRIBUTION: ${{ steps.infra.outputs.distribution_id }}
          PATHS: "/*"
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}

      - name: Summary Report
        run: |
          echo "============================================================"
          echo "🎉 Super Admin Portal undeployed and S3 bucket wiped cleanly!"
          echo "Environment : ${{ inputs.environment }}"
          echo "S3 Bucket   : ${{ steps.infra.outputs.s3_bucket }}"
          echo "============================================================"
